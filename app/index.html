<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What's Written™</title>
<meta name="description" content="Snap the professor's handwriting, get clean notes.">
<meta http-equiv="refresh" content="1; url=https://claude.ai/artifact/A39weh5RW3wDt5h6R3P3hJ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#07080a;--ink:#e8eaed;--muted:#7d838c;--line:rgba(255,255,255,.09);--accent:#5ef0c8;--glow:rgba(94,240,200,.35);color-scheme:dark}
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:var(--bg);color:var(--ink);font:500 13px "JetBrains Mono",ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 0,var(--bg) 70%)}
  h1,.bar,a,footer{position:relative}
  h1{font:inherit;letter-spacing:.32em}
  h1 span{color:var(--accent);text-shadow:0 0 18px var(--glow)} h1 sup{font-size:9px;letter-spacing:0;color:var(--muted)}
  .bar{width:160px;height:2px;background:var(--line);overflow:hidden}
  .bar::after{content:"";display:block;width:40%;height:100%;background:var(--accent);box-shadow:0 0 12px var(--glow);animation:run 1s ease-in-out infinite}
  @keyframes run{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
  a{color:#04110d;background:var(--accent);text-decoration:none;padding:14px 20px;border-radius:4px;box-shadow:0 0 22px var(--glow);letter-spacing:.16em}
  footer{position:fixed;bottom:18px;font-size:10px;color:var(--muted)}
</style>
</head>
<body>
  <h1>What's <span>Written</span><sup>™</sup></h1>
  <div class="bar"></div>
  <a id="go" href="https://claude.ai/artifact/A39weh5RW3wDt5h6R3P3hJ">Open app</a>
  <footer>© 2026 Jayant Singh Amethia</footer>
  <script>setTimeout(() => location.replace(document.getElementById('go').href), 400);</script>
</body>
</html>
